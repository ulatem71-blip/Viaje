name: Android build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VIAJE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Missing repository secret VIAJE_DEBUG_KEYSTORE_BASE64."; exit 1; fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build installable debug APK
        working-directory: ViajeRentable-v1.5
        run: ./gradlew assembleDebug
      - name: Run unit tests
        working-directory: ViajeRentable-v1.5
        run: ./gradlew test
      - uses: actions/upload-artifact@v4
        with:
          name: ViajeRentable-apk
          path: ViajeRentable-v1.5/app/build/outputs/apk/debug/app-debug.apk
