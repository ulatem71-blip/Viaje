
name: Android build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: ViajeRentable-v1.5
        run: gradle assembleRelease

      - name: Run unit tests
        working-directory: ViajeRentable-v1.5
        run: gradle test

      - uses: actions/upload-artifact@v4
        with:
          name: ViajeRentable-apk
          path: ViajeRentable-v1.5/app/build/outputs/apk/release/app-release.apk
