name: Android build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VIAJE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Missing repository secret VIAJE_DEBUG_KEYSTORE_BASE64."; exit 1; fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build installable debug APK
        working-directory: ViajeRentable-v1.5
        shell: bash
        run: |
          set +e
          sh ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '^e: |^w: .*error|error:' "$RUNNER_TEMP/build.log" | head -20 | while IFS= read -r l; do echo "::error title=Kotlin/Gradle::${l:0:900}"; done
            wnt=$(sed -n '/What went wrong/,/\* Try/p' "$RUNNER_TEMP/build.log" | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=What went wrong::${wnt:0:3500}"
            tail -n 25 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | { read -r t; echo "::error title=Last log lines::${t:0:3500}"; }
          fi
          exit "$code"
      - name: Run unit tests
        if: always()
        working-directory: ViajeRentable-v1.5
        run: sh ./gradlew test
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ViajeRentable-apk
          path: ViajeRentable-v1.5/app/build/outputs/apk/debug/app-debug.apk
